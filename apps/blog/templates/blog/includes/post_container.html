<div class="card shadow-sm mb-4 border-0 bg-light">
  <div class="card-body p-4">
    <h2 class="card-title h4 fw-semibold mb-3">
      <a href="{% url 'blog:post_detail' post_slug=post.slug %}" class="text-dark text-decoration-none">
        Заголовок поста: <span class="text-secondary">{{ post.title }}</span>
      </a>
      <!-- Жесткая проверка: бейдж видит только автор поста -->
      {% if request.user.is_authenticated and request.user == post.author %}
        <span class="badge bg-primary fs-6 align-middle ms-2">Мой пост</span>
      {% endif %}
    </h2>
    <p class="card-text text-dark mb-4 fs-5" style="line-height: 1.6;">{{ post.text }}</p>
    <div class="d-flex justify-content-between align-items-center pt-3 border-top text-secondary small">
      <span>Дата создания поста: {{ post.created_at|date:"d.m.Y H:i" }}</span>
    </div>
  </div>
</div>
