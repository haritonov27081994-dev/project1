{% extends "blog/base.html" %}

{% block page_title %}
  CryBloga | Добавить пост
{% endblock page_title %}

{% block page_content %}
  <h1>Новый пост</h1>

  <form method="POST" novalidate>
    {% csrf_token %}

    {% for field in form %}
      <div>
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}

    <br>
    <button type="submit">Добавить</button>
  </form>
{% endblock page_content %}
