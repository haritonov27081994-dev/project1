{% extends "blog/base.html" %}
{% block page_title %}CryBloga | Все посты{% endblock %}

{% block page_content %}
<div class="row">
  <div class="col-md-8 mx-auto">
    <h1 class="mb-4 text-dark fw-bold">Все посты</h1>
    {% for post in posts %}
      {% include 'blog/includes/post_container.html' %}
    {% empty %}
      <div class="text-center py-5">
        <p class="text-muted fs-5">Постов пока нет. Будьте первым, кто добавит пост!</p>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
