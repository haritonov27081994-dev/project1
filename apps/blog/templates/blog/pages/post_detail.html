{% extends "blog/base.html" %}

{% block page_title %}
  CryBloga | {{ post.title }}
{% endblock page_title %}

{% block page_content %}
  <h2>ID поста: {{ post.id }}</h2>
  <h3>{{ post.title }}</h3>
  <p>{{ post.text }}</p>
  <p>{{ post.created_at|date:"d.m.Y H:i" }}</p>
  
  <br>
  <a href="{% url 'blog:post_edit' post_id=post.id %}">Редактировать</a>
  <br><br>
  <a href="{% url 'blog:post_remove' post_id=post.id %}">Удалить</a>
{% endblock page_content %}
