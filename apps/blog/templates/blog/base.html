{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block page_title %}{% endblock page_title %}</title>

    <link rel="icon" href="{% static 'images/favicon.png' %}" />
    
    <!-- Локальный Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'blog/css/bootstrap.min.css' %}" />
    
    <!-- Твой файл стилей -->
    <link rel="stylesheet" href="{% static 'blog/css/base.css' %}" />
    {% block styles %}{% endblock styles %}
    
    <!-- Локальный Bootstrap JS -->
    <script src="{% static 'blog/css/bootstrap.bundle.min.js' %}"></script>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-sm bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="{% url 'blog:home_page' %}">CryBloga</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="{% url 'blog:home_page' %}">Главная</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'blog:post_list' %}">Посты</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'blog:post_add' %}">Добавить пост</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>{% block page_content %}{% endblock page_content %}</main>

    <footer>&copy; Все права защищены 2026</footer>
  </body>
</html>
